<!DOCTYPE html>
<html>
<head>
  <title>LinkedIn Job Parser</title>
  <style>
    body {
      width: 400px; /* Double the standard popup width */
      min-height: 200px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    #jobDetails {
      white-space: pre-wrap; /* Enables soft wrapping */
      word-wrap: break-word; /* Ensures long words break */
      border: 1px solid #ddd;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    button {
      margin: 10px 0;
      padding: 5px 10px;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
    }
    h2 {
      margin-block-start: 0;
    }
    h3 {
      margin-block-start: 0;
    }

  </style>
</head>
<body>
  <h2>Job Page Details</h2>
  <div id="jobDetails"></div>
  <button id="resumeMatchBtn">Match Resume</button>
  <script src="popup.js"></script>
</body>
</html>
